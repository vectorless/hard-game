<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hard Game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a0f;
    color: #eee;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  #hud {
    width: 960px;
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #hud .right { color: #ff5577; }
  #hud .mid   { color: #88aaff; }
  canvas {
    background: #0a0a0f;
    border: 2px solid #222;
    box-shadow: 0 0 40px rgba(255, 60, 90, 0.15);
    image-rendering: pixelated;
  }
  #footer {
    width: 960px;
    padding: 8px 4px;
    font-size: 12px;
    color: #555;
    text-align: center;
    letter-spacing: 1px;
  }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div id="modeInfo">MENU</div>
    <div class="mid" id="hpLabel">BOSS</div>
    <div class="right" id="status">PRESS ENTER</div>
  </div>
  <canvas id="c" width="960" height="540"></canvas>
  <div id="footer">ARROW KEYS / WASD TO MOVE &nbsp;|&nbsp; SHIFT TO FOCUS (REVEALS HITBOX) &nbsp;|&nbsp; R TO RESTART &nbsp;|&nbsp; ESC FOR MENU</div>
</div>

<script>
"use strict";

const W = 960, H = 540;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const elMode = document.getElementById('modeInfo');
const elHp = document.getElementById('hpLabel');
const elStatus = document.getElementById('status');

// Input ---------------------------------------------------------------
const keys = {};
const pressed = {};
window.addEventListener('keydown', e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Escape','ShiftLeft','ShiftRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
function left()  { return keys['ArrowLeft']  || keys['KeyA']; }
function right() { return keys['ArrowRight'] || keys['KeyD']; }
function up()    { return keys['ArrowUp']    || keys['KeyW']; }
function down()  { return keys['ArrowDown']  || keys['KeyS']; }
function focusHeld() { return keys['ShiftLeft'] || keys['ShiftRight']; }

// State ---------------------------------------------------------------
const MENU = 'MENU', PLAY = 'PLAY', DEAD = 'DEAD', WIN = 'WIN';
let state = MENU;
let attempts = 0;
let bestHp = 100; // lowest boss HP reached across attempts (we drain from 100 to 0)
let taunt = '';

// Difficulty ----------------------------------------------------------
// Multipliers tweak pattern timings and bullet speeds. Easy also recolors the boss blue.
const DIFFS = {
  EASY:   { label: 'EASY',   drain: 100 / 55, aimMul: 1.7, spiralMul: 1.6, wallMul: 1.6, homeMul: 1.6, bulletMul: 0.7, homeTurnMul: 0.55, homeCap: 4, color: '#3377cc', colorBright: '#55aaff', glow: 'rgba(80,160,255,', spiralCol: '#88ddff' },
  NORMAL: { label: 'NORMAL', drain: 100 / 80, aimMul: 1.0, spiralMul: 1.0, wallMul: 1.0, homeMul: 1.0, bulletMul: 1.0, homeTurnMul: 1.0,  homeCap: 8, color: '#cc3355', colorBright: '#ff3355', glow: 'rgba(255,80,120,',  spiralCol: '#ffd866' },
};
let difficulty = 'NORMAL';
let diff = DIFFS[difficulty];

const TAUNTS = [
  "is that all?",
  "skill issue.",
  "try focusing, genius.",
  "the boss yawns.",
  "did you blink?",
  "step lighter, soft hands.",
  "again. and again. and again.",
  "your hitbox is smaller than your ego.",
  "the wall didn't move. you did.",
  "imagine surviving."
];

// Player --------------------------------------------------------------
const player = {
  x: W * 0.5, y: H * 0.78,
  r: 8,         // visual radius
  hit: 3,       // true hitbox radius (tiny)
  speed: 320,   // px/s
  focusSpeed: 130,
};

// Boss ----------------------------------------------------------------
const boss = {
  x: W * 0.5, y: 90,
  r: 28,
  hp: 100,
  drift: 70,        // px/s sideways
  driftDir: 1,
  flash: 0,         // 0..1, increases when entering panic
};

// Bullets -------------------------------------------------------------
// Pool of bullet objects. type: 'aim','spiral','wall','home'
const bullets = [];
function spawn(type, x, y, vx, vy, r, extra) {
  // reuse a dead slot if available
  for (let i = 0; i < bullets.length; i++) {
    if (!bullets[i].alive) {
      const b = bullets[i];
      b.type = type; b.x = x; b.y = y; b.vx = vx; b.vy = vy;
      b.r = r; b.alive = true; b.t = 0;
      b.gapX = extra?.gapX ?? 0; b.gapW = extra?.gapW ?? 0;
      b.targetting = extra?.targetting ?? false;
      return b;
    }
  }
  bullets.push({
    type, x, y, vx, vy, r, alive: true, t: 0,
    gapX: extra?.gapX ?? 0, gapW: extra?.gapW ?? 0,
    targetting: extra?.targetting ?? false,
  });
}
function clearBullets() {
  for (const b of bullets) b.alive = false;
}

// Pattern timers ------------------------------------------------------
let tAim = 0;        // next aimed burst
let tSpiral = 0;     // next spiral emit
let spiralAngle = 0;
let tWall = 0;       // next wall
let tHome = 0;       // next homing
let homeCount = 0;   // currently alive homing bullets

// Game timers ---------------------------------------------------------
let bossDrainRate = 100 / 80; // overwritten by difficulty in startGame()
let shake = 0; // current screen shake magnitude (decays)

// Helpers -------------------------------------------------------------
function dist2(ax, ay, bx, by) { const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rand(a, b) { return a + Math.random() * (b - a); }

function phaseName(hp) {
  if (hp > 75) return 'WARMUP';
  if (hp > 50) return 'SPIRAL';
  if (hp > 25) return 'WALLS';
  return 'PANIC';
}

// Reset ---------------------------------------------------------------
function startGame() {
  diff = DIFFS[difficulty];
  bossDrainRate = diff.drain;
  clearBullets();
  player.x = W * 0.5; player.y = H * 0.78;
  boss.x = W * 0.5; boss.y = 90; boss.hp = 100; boss.driftDir = 1; boss.flash = 0;
  tAim = 0.6; tSpiral = 1.0; spiralAngle = 0; tWall = 2.0; tHome = 1.5;
  homeCount = 0; shake = 0;
  state = PLAY;
}

function die() {
  if (state !== PLAY) return;
  attempts += 1;
  bestHp = Math.min(bestHp, boss.hp);
  taunt = TAUNTS[Math.floor(Math.random() * TAUNTS.length)];
  shake = 14;
  state = DEAD;
}

function win() {
  bestHp = 0;
  state = WIN;
}

// Main loop -----------------------------------------------------------
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05; // clamp big stalls

  // Input transitions
  if (state === MENU) {
    if (pressed['ArrowLeft']  || pressed['KeyA']) difficulty = 'EASY';
    if (pressed['ArrowRight'] || pressed['KeyD']) difficulty = 'NORMAL';
    if (pressed['Digit1']) difficulty = 'EASY';
    if (pressed['Digit2']) difficulty = 'NORMAL';
    if (pressed['Enter']) startGame();
  }
  if ((state === DEAD || state === WIN) && pressed['KeyR']) startGame();
  if (pressed['Escape']) { state = MENU; clearBullets(); }

  if (state === PLAY) update(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  render(dt);

  // clear per-frame pressed map
  for (const k in pressed) pressed[k] = false;

  requestAnimationFrame(loop);
}

// Update --------------------------------------------------------------
function update(dt) {
  // Player movement
  const focused = focusHeld();
  const sp = focused ? player.focusSpeed : player.speed;
  let dx = 0, dy = 0;
  if (left())  dx -= 1;
  if (right()) dx += 1;
  if (up())    dy -= 1;
  if (down())  dy += 1;
  if (dx || dy) {
    const inv = 1 / Math.hypot(dx, dy);
    player.x += dx * inv * sp * dt;
    player.y += dy * inv * sp * dt;
  }
  player.x = clamp(player.x, 12, W - 12);
  player.y = clamp(player.y, 12, H - 12);

  // Boss drift
  boss.x += boss.drift * boss.driftDir * dt;
  if (boss.x < 120)      { boss.x = 120;     boss.driftDir = 1;  }
  if (boss.x > W - 120)  { boss.x = W - 120; boss.driftDir = -1; }

  // HP drain
  boss.hp -= bossDrainRate * dt;
  if (boss.hp <= 0) { boss.hp = 0; win(); return; }

  // Panic flash ramp
  const inPanic = boss.hp <= 25;
  boss.flash = clamp(boss.flash + (inPanic ? dt * 2 : -dt * 2), 0, 1);

  // Pattern: aimed bursts (always on) ---------------------------------
  tAim -= dt;
  if (tAim <= 0) {
    // bursts get faster as HP drops
    const interval = (boss.hp > 75 ? 1.05 : boss.hp > 50 ? 0.9 : boss.hp > 25 ? 0.75 : 0.6) * diff.aimMul;
    tAim = interval;
    const ang = Math.atan2(player.y - boss.y, player.x - boss.x);
    const speed = (boss.hp > 50 ? 170 : 200) * diff.bulletMul;
    const spread = 0.18;
    // easy fires a single shot instead of a 3-shot fan
    const lo = difficulty === 'EASY' ? 0 : -1;
    const hi = difficulty === 'EASY' ? 0 :  1;
    for (let i = lo; i <= hi; i++) {
      const a = ang + i * spread;
      spawn('aim', boss.x, boss.y + 8, Math.cos(a) * speed, Math.sin(a) * speed, 5);
    }
  }

  // Pattern: spiral (HP <= 75) ----------------------------------------
  if (boss.hp <= 75) {
    tSpiral -= dt;
    spiralAngle += dt * 2.2;
    if (tSpiral <= 0) {
      tSpiral = 0.06 * diff.spiralMul;
      const sp2 = 130 * diff.bulletMul;
      // two arms, opposite rotation
      const a1 = spiralAngle;
      const a2 = -spiralAngle + Math.PI;
      spawn('spiral', boss.x, boss.y, Math.cos(a1) * sp2, Math.sin(a1) * sp2, 4);
      spawn('spiral', boss.x, boss.y, Math.cos(a2) * sp2, Math.sin(a2) * sp2, 4);
    }
  }

  // Pattern: walls (HP <= 50) -----------------------------------------
  if (boss.hp <= 50) {
    tWall -= dt;
    if (tWall <= 0) {
      tWall = 2.4 * diff.wallMul;
      // easy: wider gap so the wall is much more forgiving
      const gapW = difficulty === 'EASY' ? 200 : 110;
      const gapX = rand(60, W - 60 - gapW);
      const y0 = boss.y + 40;
      const r = 7;
      const step = 18;
      for (let x = 20; x < W - 20; x += step) {
        if (x > gapX && x < gapX + gapW) continue;
        spawn('wall', x, y0, 0, 130 * diff.bulletMul, r, { gapX, gapW });
      }
    }
  }

  // Pattern: homing (HP <= 25) ----------------------------------------
  if (boss.hp <= 25) {
    tHome -= dt;
    if (tHome <= 0 && homeCount < diff.homeCap) {
      tHome = 0.55 * diff.homeMul;
      const a = rand(0, Math.PI * 2);
      const sp3 = 90 * diff.bulletMul;
      spawn('home', boss.x, boss.y, Math.cos(a) * sp3, Math.sin(a) * sp3, 5, { targetting: true });
      homeCount++;
    }
  }

  // Move + cull bullets, collide with player --------------------------
  const hitR = (player.hit + 4); // some forgiveness ring around the tiny hitbox
  for (const b of bullets) {
    if (!b.alive) continue;
    b.t += dt;

    if (b.type === 'home') {
      // weak homing — adjust velocity toward player
      const ang = Math.atan2(player.y - b.y, player.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      let diff = ang - cur;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      const turn = 1.2 * diff.homeTurnMul * dt; // rad/s
      const newAng = cur + clamp(diff, -turn, turn);
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(newAng) * sp;
      b.vy = Math.sin(newAng) * sp;
    }

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      b.alive = false;
      if (b.type === 'home') homeCount = Math.max(0, homeCount - 1);
      continue;
    }

    // collision against the TRUE inner hitbox
    const d2 = dist2(b.x, b.y, player.x, player.y);
    const rr = b.r + player.hit;
    if (d2 <= rr * rr) {
      die();
      return;
    }
  }
}

// Render --------------------------------------------------------------
function render() {
  // shake offset
  const sx = (Math.random() - 0.5) * shake;
  const sy = (Math.random() - 0.5) * shake;

  ctx.save();
  ctx.translate(sx, sy);

  // background
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  // subtle grid (cheap atmosphere)
  ctx.strokeStyle = '#13131a';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  if (state === MENU) {
    drawTitle();
    ctx.restore();
    updateHud();
    return;
  }

  // Boss
  drawBoss();

  // Bullets
  for (const b of bullets) {
    if (!b.alive) continue;
    if (b.type === 'aim') ctx.fillStyle = diff.colorBright;
    else if (b.type === 'spiral') ctx.fillStyle = diff.spiralCol;
    else if (b.type === 'wall') ctx.fillStyle = '#88aaff';
    else ctx.fillStyle = '#aa66ff'; // home
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player
  drawPlayer();

  // Death / win overlays
  if (state === DEAD) drawDead();
  if (state === WIN)  drawWin();

  ctx.restore();
  updateHud();
}

function drawTitle() {
  ctx.fillStyle = '#ff5577';
  ctx.font = 'bold 56px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('HARD GAME', W/2, H/2 - 100);
  ctx.fillStyle = '#eee';
  ctx.font = '20px Courier New';
  ctx.fillText('one boss. no checkpoints. tiny hitbox.', W/2, H/2 - 60);

  // difficulty selector
  ctx.font = 'bold 22px Courier New';
  const easySel = difficulty === 'EASY';
  const normSel = difficulty === 'NORMAL';
  ctx.fillStyle = easySel ? '#55aaff' : '#555';
  ctx.fillText(easySel ? '> EASY <' : 'EASY', W/2 - 130, H/2 - 10);
  ctx.fillStyle = normSel ? '#ff5577' : '#555';
  ctx.fillText(normSel ? '> NORMAL <' : 'NORMAL', W/2 + 140, H/2 - 10);
  ctx.fillStyle = '#666';
  ctx.font = '13px Courier New';
  ctx.fillText('LEFT / RIGHT to choose', W/2, H/2 + 18);

  ctx.fillStyle = '#88aaff';
  ctx.font = '16px Courier New';
  ctx.fillText('arrows / wasd to move', W/2, H/2 + 60);
  ctx.fillText('hold SHIFT to focus (slows you, shows your real hitbox)', W/2, H/2 + 84);
  ctx.fillText('survive until the boss\'s HP hits zero', W/2, H/2 + 108);
  ctx.fillStyle = '#ff5577';
  ctx.font = 'bold 22px Courier New';
  ctx.fillText('PRESS ENTER', W/2, H/2 + 160);
  if (attempts > 0) {
    ctx.fillStyle = '#666';
    ctx.font = '14px Courier New';
    ctx.fillText(`attempts: ${attempts}    closest: boss HP ${bestHp.toFixed(0)}`, W/2, H - 30);
  }
}

function drawBoss() {
  // glow
  const grad = ctx.createRadialGradient(boss.x, boss.y, 4, boss.x, boss.y, boss.r * 2.2);
  const glowAlpha = 0.35 + 0.15 * boss.flash;
  grad.addColorStop(0, diff.glow + glowAlpha + ')');
  grad.addColorStop(1, diff.glow + '0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(boss.x, boss.y, boss.r * 2.2, 0, Math.PI * 2);
  ctx.fill();

  // body
  ctx.fillStyle = boss.flash > 0.5 ? diff.colorBright : diff.color;
  ctx.beginPath();
  ctx.arc(boss.x, boss.y, boss.r, 0, Math.PI * 2);
  ctx.fill();
  // eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(boss.x, boss.y - 4, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  const eyeAng = Math.atan2(player.y - boss.y, player.x - boss.x);
  ctx.beginPath();
  ctx.arc(boss.x + Math.cos(eyeAng)*3, boss.y - 4 + Math.sin(eyeAng)*3, 4, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlayer() {
  // outer "ship" ring
  ctx.strokeStyle = '#88aaff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.stroke();
  // inner hitbox: visible always faintly, bright when focused
  ctx.fillStyle = focusHeld() ? '#ffffff' : 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.hit, 0, Math.PI * 2);
  ctx.fill();
  // focus crosshair
  if (focusHeld()) {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(player.x - 14, player.y); ctx.lineTo(player.x - 6, player.y);
    ctx.moveTo(player.x + 6, player.y);  ctx.lineTo(player.x + 14, player.y);
    ctx.moveTo(player.x, player.y - 14); ctx.lineTo(player.x, player.y - 6);
    ctx.moveTo(player.x, player.y + 6);  ctx.lineTo(player.x, player.y + 14);
    ctx.stroke();
  }
}

function drawDead() {
  ctx.fillStyle = 'rgba(10,10,15,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff5577';
  ctx.font = 'bold 48px Courier New';
  ctx.fillText('YOU DIED', W/2, H/2 - 30);
  ctx.fillStyle = '#eee';
  ctx.font = '20px Courier New';
  ctx.fillText(`"${taunt}"`, W/2, H/2 + 10);
  ctx.fillStyle = '#88aaff';
  ctx.font = '16px Courier New';
  ctx.fillText(`attempt ${attempts}   closest: boss HP ${bestHp.toFixed(0)}`, W/2, H/2 + 44);
  ctx.fillStyle = '#ff5577';
  ctx.font = 'bold 18px Courier New';
  ctx.fillText('PRESS R TO TRY AGAIN', W/2, H/2 + 90);
}

function drawWin() {
  ctx.fillStyle = 'rgba(10,10,15,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd866';
  ctx.font = 'bold 56px Courier New';
  ctx.fillText('YOU WIN', W/2, H/2 - 20);
  ctx.fillStyle = '#eee';
  ctx.font = '18px Courier New';
  ctx.fillText(`the boss falls. attempts: ${attempts + 1}`, W/2, H/2 + 20);
  ctx.fillStyle = '#88aaff';
  ctx.font = '16px Courier New';
  ctx.fillText('PRESS R FOR ANOTHER GO', W/2, H/2 + 60);
}

function updateHud() {
  if (state === MENU) {
    elMode.textContent = 'MENU';
    elHp.textContent = `BEST HP REACHED ${bestHp.toFixed(0)}`;
    elStatus.textContent = 'PRESS ENTER';
    elStatus.className = 'right blink';
  } else if (state === PLAY) {
    elMode.textContent = `${diff.label} - PHASE: ${phaseName(boss.hp)}`;
    const bars = 20;
    const filled = Math.round((boss.hp / 100) * bars);
    elHp.textContent = `BOSS [${'#'.repeat(filled)}${'.'.repeat(bars - filled)}] ${boss.hp.toFixed(0)}`;
    elStatus.textContent = `ATTEMPT ${attempts + 1}`;
    elStatus.className = 'right';
  } else if (state === DEAD) {
    elMode.textContent = 'DEAD';
    elHp.textContent = `BOSS HP ${boss.hp.toFixed(0)}`;
    elStatus.textContent = 'PRESS R';
    elStatus.className = 'right blink';
  } else if (state === WIN) {
    elMode.textContent = 'CLEARED';
    elHp.textContent = `BOSS HP 0`;
    elStatus.textContent = 'PRESS R';
    elStatus.className = 'right blink';
  }
}

requestAnimationFrame(now => { last = now; loop(now); });
</script>
</body>
</html>
